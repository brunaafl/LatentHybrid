services:

  hybrid-EA-freeze-bn:
    profiles: ["Hybrid-Test", "EA", "Freeze", "Hybrid-BN", "Hybrid-BN-EA"]
    extends:
      file: base.yml
      service: base-experiment
    container_name: hybrid-ea-freeze-bn
    command: "python src/Bruna/domain_adapt_exp1.py --model EEGNet --config config/config.yaml --ea alignment --freeze freeze --num_exp exp_shared --dataset BNCI2014001 --remove_bn False"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [ gpu ]

  hybrid-EA-freeze-bn-robin:
