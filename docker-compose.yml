services:

###### SHARED BASELINE ######

  shared-ea-bn-weibo:
    profiles: [ "Shared", "weibo" ]
    extends:
      file: base.yml
      service: base-experiment
    container_name: shared-ea-freeze-bn-weibo
    command: "python src/Bruna/domain_adapt_eegshared_exp.py --model EEGNet --config config/config_weibo.yaml --ea alignment --freeze freeze --num_exp exp_shared --dataset Weibo2014 --remove_bn False --criterion_type CrossEntropyLoss"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '1' ]
              capabilities: [ gpu ]

  shared-noea-bn-weibo:
    profiles: [ "Shared", "weibo" ]
    extends:
      file: base.yml
      service: base-experiment
    container_name: shared-noea-freeze-bn-weibo
    command: "python src/Bruna/domain_adapt_eegshared_exp.py --model EEGNet --config config/config_weibo.yaml --ea no-alignment --freeze freeze --num_exp exp_shared --dataset Weibo2014 --remove_bn False --criterion_type CrossEntropyLoss"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '1' ]
              capabilities: [ gpu ]

  shared-ea-bn-bnci:
    profiles: ["Shared", "bnci"]
    extends:
      file: base.yml
      service: base-experiment
    container_name: shared-ea-bn
    command: "python src/Bruna/domain_adapt_eegshared_exp.py --model EEGNetShared --config config/config.yaml --ea alignment --freeze freeze --num_exp exp_shared --dataset BNCI2014001 --remove_bn False --criterion_type CrossEntropyLoss"
