services:

#### BNCI EA ALL BN

  shared-EA-freeze-bn-lea:
    profiles: ["Shared", "EA", "Freeze", "Hybrid-BN", "Hybrid-BN-EA"]
    extends:
      file: base.yml
      service: base-experiment
    container_name: shared-ea-freeze-bn-lea
    command: "python src/Bruna/domain_adapt_shared_exp.py --model EEGNetShared --config config/config.yaml --ea alignment --freeze freeze --num_exp exp_shared --dataset BNCI2014001 --remove_bn LEA --mode Inference"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [ gpu ]
