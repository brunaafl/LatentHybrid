services:
  no-EA-no-freeze-c4:
    profiles: ["experiments", "suite-eeg", "exemplo"]
    extends:
      file: base.yml
      service: base-experiment
    container_name: no-EA-no-freeze-c4
    command: "python src/Bruna/domain_adapt_exp1.py --config_file config/config.yaml --ea no-alignment --freeze no-freeze --num_exp exp_hybrid --dataset BNCI2014001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [ gpu ]

