  profiling:
    profiles: ["debug"]
    extends:
      file: base.yml
      service: base-experiment
    container_name: debug-profile
    command: "python -m torch.utils.bottleneck src/Bruna/domain_adapt_exp1.py --config_file config/config.yaml --ea alignment --freeze no-freeze --num_exp exp_hybrid --dataset ${DATASET}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [ gpu ]

  shared-test:
    profiles: ["shared"]
    extends:
      file: base.yml
      service: base-experiment
    container_name: test
    command: "python src/Bruna/domain_adapt_shared_exp.py --config_file config/config.yaml --ea no-alignment --freeze no-freeze --num_exp exp_shared --dataset ${DATASET}"
    deploy:
      resources:
